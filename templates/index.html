<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Vision Analytics</title>
  <meta name="description" content="Dashboard de analitica de trafico vehicular multicamara en tiempo real." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            surface: { 50:'#f0f4ff', 100:'#e0e9ff', 900:'#070c1a', 800:'#0d1530', 750:'#0f1a38', 700:'#111c40', 600:'#1a2755' },
            accent:  { DEFAULT:'#3b82f6', light:'#60a5fa', dark:'#1d4ed8' },
            success: '#22c55e', warn: '#f59e0b', danger: '#ef4444',
            lead:    '#a78bfa', bounce: '#fb923c',
          },
        },
      },
    };
  </script>

  <style>
    :root { --sidebar-w: 280px; }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:#070c1a; }
    ::-webkit-scrollbar-thumb { background:#1a2755; border-radius:4px; }

    body { font-family:'Inter',sans-serif; background:#070c1a; color:#e2e8f0; margin:0; overflow:hidden; height:100vh; display:flex; flex-direction:column; }

    /* GLASS */
    .glass { background:rgba(13,21,48,0.65); backdrop-filter:blur(14px); border:1px solid rgba(59,130,246,0.12); }

    /* SIDEBAR */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: #0d1530;
      border-right: 1px solid rgba(59,130,246,0.15);
      display: flex; flex-direction: column;
      overflow-y: auto;
      transition: width 0.3s ease, min-width 0.3s ease;
      position: relative; z-index: 20;
    }
    #sidebar.collapsed { width:64px; min-width:64px; }
    #sidebar.collapsed .sidebar-label { opacity:0; pointer-events:none; width:0; overflow:hidden; }
    #sidebar.collapsed .sidebar-header-text { display:none; }

    /* CAM CARD en sidebar */
    .cam-chip {
      display: flex; align-items: center; gap:10px;
      padding: 10px 12px; border-radius:10px; cursor:pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      position: relative;
    }
    .cam-chip:hover { background:rgba(59,130,246,0.1); border-color:rgba(59,130,246,0.25); }
    .cam-chip.active { background:rgba(59,130,246,0.18); border-color:rgba(59,130,246,0.5); }
    .cam-chip.active .chip-icon { background:#3b82f6; }
    .chip-icon {
      width:36px; height:36px; border-radius:8px;
      background:#1a2755; display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:700; color:#93c5fd; flex-shrink:0;
      transition:background 0.2s;
    }
    .cam-status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

    /* LAYOUT PRINCIPAL */
    #app { display:flex; flex:1; overflow:hidden; }
    #content { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* GRID DE FEEDS */
    #feed-grid {
      flex:1; display:grid; gap:12px; padding:12px; overflow:hidden;
      grid-template-columns: 1fr;
      align-items: stretch;
    }
    #feed-grid.cols-2 { grid-template-columns: 1fr 1fr; }
    #feed-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

    /* FEED CARD */
    .feed-card {
      position:relative; background:#0d1530; border-radius:14px;
      border:1px solid rgba(59,130,246,0.15); overflow:hidden;
      display:flex; flex-direction:column;
      transition: border-color 0.3s ease;
    }
    .feed-card.selected-focus { border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,0.3); }
    .feed-card-header {
      padding:8px 12px; background:#0f1a38;
      border-bottom:1px solid rgba(59,130,246,0.1);
      display:flex; align-items:center; justify-content:between; gap:8px;
      flex-shrink:0;
    }
    .feed-video-wrap { flex:1; position:relative; background:#040810; min-height:0; }
    .feed-video-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .feed-metrics-bar {
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:6px; padding:8px 10px;
      background:#070c1a; border-top:1px solid rgba(59,130,246,0.08);
      flex-shrink:0;
    }
    .metric-pill { text-align:center; }
    .metric-pill .val { font-size:1.3rem; font-weight:800; line-height:1; }
    .metric-pill .lbl { font-size:0.6rem; color:#64748b; letter-spacing:0.05em; text-transform:uppercase; margin-top:2px; }

    /* CHIP de clase vehiculo */
    .class-chip { font-size:0.65rem; padding:2px 7px; border-radius:20px; font-weight:600; }

    /* OVERLAY de sin señal */
    .no-signal-overlay {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:8px;
      background:#040810; color:#1e3a5f;
    }

    /* ANIMACIONES */
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .fade-in { animation: fadeIn 0.35s ease-out forwards; }
    .val-flash { transition:color 0.4s ease,transform 0.4s ease; }
    .val-flash.bump { color:#60a5fa !important; transform:scale(1.12); }

    /* KPI globales top bar */
    #topbar { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:8px 14px; background:#0d1530; border-bottom:1px solid rgba(59,130,246,0.12); flex-wrap:wrap; }
    .kpi-badge { display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.15); font-size:0.78rem; }
    .kpi-badge .kv { font-weight:700; font-size:1rem; }

    /* HEADER */
    #header { flex-shrink:0; display:flex; align-items:center; gap:12px; padding:10px 16px; background:#0d1530; border-bottom:1px solid rgba(59,130,246,0.18); z-index:30; }
  </style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════════════════════════ -->
<header id="header">
  <!-- Burger -->
  <button id="burger-btn" onclick="toggleSidebar()"
    class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors flex-shrink-0">
    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Logo -->
  <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-700 flex items-center justify-center flex-shrink-0">
    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 10l4.553-2.069A1 1 0 0121 8.82V15.18a1 1 0 01-1.447.89L15 14M3 8h12a2 2 0 012 2v4a2 2 0 01-2 2H3a2 2 0 01-2-2v-4a2 2 0 012-2z"/>
    </svg>
  </div>
  <div class="flex-1 min-w-0">
    <h1 class="text-sm font-bold text-white leading-none">Traffic Vision Analytics</h1>
    <p class="text-xs text-blue-400 mt-0.5">YOLOv8 · ByteTrack · OpenVINO</p>
  </div>

  <!-- Layout picker -->
  <div class="flex items-center gap-1.5 ml-auto">
    <span class="text-xs text-gray-500 hidden sm:block">Vista:</span>
    <button onclick="setLayout(1)" id="layout-1"
      class="layout-btn px-2.5 py-1 text-xs rounded-md bg-blue-600 text-white">1</button>
    <button onclick="setLayout(2)" id="layout-2"
      class="layout-btn px-2.5 py-1 text-xs rounded-md bg-surface-700 text-gray-400 hover:bg-surface-600">2</button>
    <button onclick="setLayout(3)" id="layout-3"
      class="layout-btn px-2.5 py-1 text-xs rounded-md bg-surface-700 text-gray-400 hover:bg-surface-600">3</button>
  </div>

  <!-- WS status -->
  <div id="ws-badge" class="flex items-center gap-1.5 px-3 py-1 rounded-full glass text-xs ml-2 flex-shrink-0">
    <span id="ws-dot" class="w-2 h-2 rounded-full bg-gray-600 pulse"></span>
    <span id="ws-lbl" class="text-gray-400">Conectando</span>
  </div>
</header>

<!-- ══ KPI TOP BAR ══════════════════════════════════════════════════════════ -->
<div id="topbar">
  <div class="kpi-badge">
    <span class="text-green-400 text-lg">↑</span>
    <div><span class="text-gray-400">Entradas</span> <span class="kv text-green-400 val-flash" id="g-in">0</span></div>
  </div>
  <div class="kpi-badge">
    <span class="text-red-400 text-lg">↓</span>
    <div><span class="text-gray-400">Salidas</span> <span class="kv text-red-400 val-flash" id="g-out">0</span></div>
  </div>
  <div class="kpi-badge">
    <span class="text-violet-400 text-base">◆</span>
    <div><span class="text-gray-400">Leads</span> <span class="kv text-violet-400 val-flash" id="g-leads">0</span></div>
  </div>
  <div class="kpi-badge">
    <span class="text-orange-400 text-base">◇</span>
    <div><span class="text-gray-400">Bounced</span> <span class="kv text-orange-400 val-flash" id="g-bounced">0</span></div>
  </div>
  <div class="ml-auto text-xs text-gray-600 font-mono hidden md:block" id="clock">--:--:--</div>
</div>

<!-- ══ BODY: SIDEBAR + CONTENT ══════════════════════════════════════════════ -->
<div id="app">

  <!-- ── SIDEBAR: SELECTOR DE CÁMARAS ─────────────────────────────── -->
  <aside id="sidebar">
    <!-- Header sidebar -->
    <div class="flex items-center gap-2 px-4 py-3 border-b border-blue-900/30">
      <svg class="w-4 h-4 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 10l4.553-2.069A1 1 0 0121 8.82V15.18a1 1 0 01-1.447.89L15 14M3 8h12a2 2 0 012 2v4a2 2 0 01-2 2H3a2 2 0 01-2-2v-4a2 2 0 012-2z"/>
      </svg>
      <span class="sidebar-header-text text-xs font-semibold text-gray-400 uppercase tracking-widest">Cámaras</span>
    </div>

    <!-- Acciones rápidas -->
    <div class="px-3 py-2 border-b border-blue-900/20 sidebar-label flex gap-2">
      <button onclick="selectAll()"
        class="flex-1 text-xs py-1.5 rounded-lg bg-blue-900/30 hover:bg-blue-700/30 text-blue-300 transition-colors">
        Todas
      </button>
      <button onclick="selectNone()"
        class="flex-1 text-xs py-1.5 rounded-lg bg-surface-700 hover:bg-surface-600 text-gray-400 transition-colors">
        Ninguna
      </button>
    </div>
    <div class="px-3 py-2 border-b border-blue-900/20 sidebar-label">
      <button onclick="openDeviceManager()"
        class="w-full text-xs py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition-colors flex items-center justify-center gap-1">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Gestor de Cámaras
      </button>
    </div>

    <!-- Lista de chips de cámaras (generada por JS) -->
    <div id="cam-list" class="flex-1 overflow-y-auto p-3 space-y-2">
      <p class="text-xs text-gray-600 text-center py-4">Esperando datos...</p>
    </div>

    <!-- Log de eventos -->
    <div class="border-t border-blue-900/20 sidebar-label">
      <p class="text-xs text-gray-600 uppercase tracking-widest px-4 pt-3 pb-1">Log</p>
      <div id="event-log" class="font-mono text-xs px-3 pb-3 space-y-0.5 max-h-32 overflow-y-auto text-gray-500"></div>
    </div>
  </aside>

  <!-- ── CONTENT: FEEDS ─────────────────────────────────────────────── -->
  <div id="content">
    <div id="feed-grid">
      <div class="flex items-center justify-center text-gray-700 text-sm">Conectando al servidor...</div>
    </div>
  </div>

</div>

<!-- ── MODAL GESTOR DE CÁMARAS ─────────────────────────────────────────────── -->
<div id="device-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity duration-300 opacity-0">
  <div class="bg-surface-800 rounded-xl border border-blue-900/30 w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
    <div class="flex items-center justify-between p-4 border-b border-blue-900/30 bg-surface-750 rounded-t-xl">
      <h2 class="text-white font-semibold text-lg flex items-center gap-2">
        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.82V15.18a1 1 0 01-1.447.89L15 14M3 8h12a2 2 0 012 2v4a2 2 0 01-2 2H3a2 2 0 01-2-2v-4a2 2 0 012-2z"></path></svg>
        Gestor de Cámaras
      </h2>
      <button onclick="closeDeviceManager()" class="text-gray-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    
    <div class="p-4 overflow-y-auto flex-1 space-y-6">
      <!-- Escaneo USB -->
      <div>
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3 border-b border-gray-700 pb-1">Cámaras USB Locales</h3>
        <div id="usb-list" class="space-y-2">
          <p class="text-xs text-gray-500 italic">Buscando dispositivos...</p>
        </div>
      </div>
      
      <!-- Añadir RTSP -->
      <div>
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3 border-b border-gray-700 pb-1">Cámara de Red (RTSP / HTTP)</h3>
        <div class="flex gap-2">
          <input type="text" id="rtsp-url" placeholder="rtsp://192.168.1.100:554/stream" 
            class="flex-1 bg-surface-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors">
          <button onclick="addRtspCamera()" 
            class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm transition-colors whitespace-nowrap font-medium">
            Añadir Stream
          </button>
        </div>
        <p id="rtsp-error" class="text-red-400 text-xs mt-2 hidden"></p>
      </div>
    </div>
    
    <div class="p-4 border-t border-blue-900/30 bg-surface-750 rounded-b-xl flex justify-end">
      <button onclick="closeDeviceManager()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm transition-colors">Cerrar</button>
    </div>
  </div>
</div>

<!-- ══════════════════ JAVASCRIPT ══════════════════════════════════════════ -->
<script>
// ─── ESTADO ───────────────────────────────────────────────────────────────
const state = {
  cameras: {},          // cam_id → last metric dict
  selected: new Set(),  // cam_ids actualmente visibles
  layout: 1,
};

const COLOR = {
  Automovil:'#3b82f6', Camion:'#ef4444', Autobus:'#f59e0b',
  Motocicleta:'#22c55e', Bicicleta:'#a78bfa',
};

// ─── SIDEBAR ──────────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ─── LAYOUT ───────────────────────────────────────────────────────────────
function setLayout(n) {
  state.layout = n;
  document.querySelectorAll('.layout-btn').forEach(b => {
    b.classList.toggle('bg-blue-600', b.id === `layout-${n}`);
    b.classList.toggle('text-white',  b.id === `layout-${n}`);
    b.classList.toggle('bg-surface-700', b.id !== `layout-${n}`);
    b.classList.toggle('text-gray-400',  b.id !== `layout-${n}`);
  });
  renderFeedGrid();
}

// ─── SELECCION DE CAMARAS ─────────────────────────────────────────────────
function toggleCam(camId) {
  const isSelected = state.selected.has(camId);
  if (isSelected) {
    state.selected.delete(camId);
  } else {
    state.selected.add(camId);
  }
  
  // Enviar comando al backend para habilitar/deshabilitar inferencia
  fetch(`/api/camera/${camId}/toggle`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: !isSelected })
  }).catch(console.error);

  updateChipStates();
  renderFeedGrid();
  logEvent(`${camId} ${!isSelected ? 'activada':'desactivada'}`, 'info');
}
function selectAll() {
  Object.keys(state.cameras).forEach(id => {
    state.selected.add(id);
    fetch(`/api/camera/${id}/toggle`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: true })
    }).catch(console.error);
  });
  updateChipStates(); renderFeedGrid();
}
function selectNone() {
  Object.keys(state.cameras).forEach(id => {
    fetch(`/api/camera/${id}/toggle`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: false })
    }).catch(console.error);
  });
  state.selected.clear();
  updateChipStates(); renderFeedGrid();
}
function updateChipStates() {
  document.querySelectorAll('.cam-chip').forEach(el => {
    const id = el.dataset.cam;
    el.classList.toggle('active', state.selected.has(id));
  });
}

// ─── SIDEBAR: CHIP DE CÁMARA ──────────────────────────────────────────────
function ensureCamChip(camId) {
  if (document.getElementById(`chip-${camId}`)) return;

  const list = document.getElementById('cam-list');
  // Quitar placeholder
  const ph = list.querySelector('p');
  if (ph) ph.remove();

  const div = document.createElement('div');
  div.className = 'cam-chip fade-in';
  div.id = `chip-${camId}`;
  div.dataset.cam = camId;
  div.onclick = () => toggleCam(camId);
  div.innerHTML = `
    <div class="chip-icon">${camId.replace('cam','C')}</div>
    <div class="flex-1 min-w-0 sidebar-label">
      <div class="flex items-center gap-2">
        <span class="text-sm font-semibold text-white truncate">${camId.toUpperCase()}</span>
        <span id="cdot-${camId}" class="cam-status-dot bg-gray-600 pulse"></span>
      </div>
      <div class="text-xs text-gray-500 mt-0.5" id="cfps-${camId}">-- FPS</div>
      <!-- Mini métricas -->
      <div class="flex gap-2 mt-1.5 sidebar-label">
        <span class="text-xs text-green-400">↑<span id="cin-${camId}" class="font-bold">0</span></span>
        <span class="text-xs text-red-400">↓<span id="cout-${camId}" class="font-bold">0</span></span>
        <span class="text-xs text-violet-400">L:<span id="cld-${camId}" class="font-bold">0</span></span>
      </div>
    </div>
    <!-- Boton reset -->
    <button onclick="event.stopPropagation(); resetCam('${camId}')"
      class="sidebar-label text-gray-600 hover:text-blue-400 transition-colors p-1 rounded flex-shrink-0"
      title="Reiniciar contadores">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </button>
  `;
  list.appendChild(div);

  // Auto-seleccionar al aparecer
  state.selected.add(camId);
  updateChipStates();
  renderFeedGrid();
}

function updateChipData(camId, data) {
  const dot = document.getElementById(`cdot-${camId}`);
  if (dot) {
    const ok = data.active_tracks > 0 || data.total_in > 0;
    dot.className = `cam-status-dot ${ok ? 'bg-green-500':'bg-yellow-500'} pulse`;
  }
  const setT = (id, v) => { const e=document.getElementById(id); if(e) e.textContent=v; };
  setT(`cfps-${camId}`, `${data.fps_processing} FPS`);
  setT(`cin-${camId}`,  data.total_in);
  setT(`cout-${camId}`, data.total_out);
  setT(`cld-${camId}`,  data.leads);
}

// ─── GRID DE FEEDS ─────────────────────────────────────────────────────────
const feedCards = {};  // cam_id → DOM element

function renderFeedGrid() {
  const grid = document.getElementById('feed-grid');
  const visible = [...state.selected];

  // Ocultar / mostrar las tarjetas existentes
  Object.keys(feedCards).forEach(id => {
    feedCards[id].style.display = state.selected.has(id) ? 'flex' : 'none';
  });

  // Crear tarjetas faltantes
  visible.forEach(camId => {
    if (!feedCards[camId]) createFeedCard(camId);
  });

  // Actualizar clase del grid segun layout y cantidad visible
  const cols = Math.min(state.layout, visible.length || 1);
  grid.className = ``;
  grid.style.cssText = `flex:1; display:grid; gap:12px; padding:12px; overflow:hidden; align-items:stretch;
    grid-template-columns: repeat(${cols}, 1fr);`;

  // Mensaje cuando no hay camaras seleccionadas
  let empty = grid.querySelector('.empty-msg');
  if (visible.length === 0) {
    if (!empty) {
      empty = document.createElement('div');
      empty.className = 'empty-msg flex items-center justify-center text-gray-700 text-sm col-span-3';
      empty.textContent = 'Selecciona una camara en el panel izquierdo';
      grid.appendChild(empty);
    }
  } else if (empty) {
    empty.remove();
  }
}

function createFeedCard(camId) {
  const grid = document.getElementById('feed-grid');
  const card = document.createElement('div');
  card.id = `card-${camId}`;
  card.className = 'feed-card fade-in';
  card.innerHTML = `
    <!-- Header -->
    <div class="feed-card-header flex items-center gap-2">
      <span id="fdot-${camId}" class="w-2 h-2 rounded-full bg-gray-600 pulse flex-shrink-0"></span>
      <span class="font-bold text-sm text-white">${camId.toUpperCase()}</span>
      <span id="ffps-${camId}" class="text-xs text-gray-500 ml-1">-- FPS</span>
      <!-- Clases activas -->
      <div id="fclasses-${camId}" class="flex flex-wrap gap-1 ml-2"></div>
      <!-- Activos -->
      <span class="ml-auto text-xs px-2 py-0.5 rounded-full bg-blue-900/40 text-blue-300">
        <span id="factive-${camId}">0</span> activos
      </span>
      <!-- Edit Line btn -->
      <button onclick="editLine('${camId}')"
        class="text-gray-600 hover:text-blue-400 transition-colors p-1 rounded ml-1"
        title="Editar línea de conteo">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
        </svg>
      </button>
      <!-- Reset btn -->
      <button onclick="resetCam('${camId}')"
        class="text-gray-600 hover:text-orange-400 transition-colors p-1 rounded ml-1"
        title="Reiniciar contadores">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>
    <!-- Video -->
    <div class="feed-video-wrap relative">
      <img src="/video_feed/${camId}" alt="Feed ${camId}" id="fimg-${camId}"
        onerror="handleImgError(this, '${camId}')" class="w-full h-full object-cover" />
        
      <!-- Editor SVG -->
      <svg id="fline-svg-${camId}" class="absolute top-0 left-0 w-full h-full pointer-events-none hidden" style="z-index:10;"></svg>
      
      <!-- Panel de Controles de Edición -->
      <div id="fline-editor-${camId}" class="absolute top-2 left-1/2 -translate-x-1/2 hidden bg-gray-900/90 p-2 rounded-lg flex items-center gap-2 z-20 border border-gray-700 shadow-xl">
        <button onclick="swapLineOrientation('${camId}')" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs text-white">Swap In/Out</button>
        <button onclick="saveLine('${camId}')" class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-xs font-bold text-white">Guardar</button>
        <button onclick="cancelEditLine('${camId}')" class="px-2 py-1 bg-red-600 hover:bg-red-500 rounded text-xs text-white">Cancelar</button>
      </div>
    </div>
    <!-- Metrics bar -->
    <div class="feed-metrics-bar">
      <div class="metric-pill">
        <div class="val text-green-400 val-flash" id="fin-${camId}">0</div>
        <div class="lbl">Entradas</div>
      </div>
      <div class="metric-pill">
        <div class="val text-red-400 val-flash" id="fout-${camId}">0</div>
        <div class="lbl">Salidas</div>
      </div>
      <div class="metric-pill">
        <div class="val text-violet-400 val-flash" id="fleads-${camId}">0</div>
        <div class="lbl">Leads</div>
      </div>
      <div class="metric-pill">
        <div class="val text-orange-400 val-flash" id="fbounced-${camId}">0</div>
        <div class="lbl">Bounced</div>
      </div>
    </div>
  `;
  grid.appendChild(card);
  feedCards[camId] = card;
}

function handleImgError(img, camId) {
  setTimeout(() => { img.src = `/video_feed/${camId}?t=${Date.now()}`; }, 2000);
}

// ─── ACTUALIZAR FEED CARD ─────────────────────────────────────────────────
function updateFeedCard(camId, data) {
  const set = (id, v) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.textContent != v) {
      el.textContent = v;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 450);
    }
  };

  const dot = document.getElementById(`fdot-${camId}`);
  if (dot) dot.className = `w-2 h-2 rounded-full ${data.active_tracks>0?'bg-green-400':'bg-yellow-500'} pulse flex-shrink-0`;

  set(`ffps-${camId}`,     `${data.fps_processing} FPS`);
  set(`factive-${camId}`,  data.active_tracks);
  set(`fin-${camId}`,      data.total_in);
  set(`fout-${camId}`,     data.total_out);
  set(`fleads-${camId}`,   data.leads);
  set(`fbounced-${camId}`, data.bounced);

  // Chips de clases activas
  const clsEl = document.getElementById(`fclasses-${camId}`);
  if (clsEl && data.class_counts) {
    clsEl.innerHTML = Object.entries(data.class_counts)
      .filter(([,v]) => v > 0)
      .map(([cls,cnt]) => `<span class="class-chip" style="background:${COLOR[cls]||'#475569'}22;color:${COLOR[cls]||'#94a3b8'};border:1px solid ${COLOR[cls]||'#475569'}44">${cls} ${cnt}</span>`)
      .join('');
  }
}

// ─── KPIs GLOBALES ────────────────────────────────────────────────────────
function updateGlobalKPIs() {
  let si=0, so=0, sl=0, sb=0;
  Object.values(state.cameras).forEach(m => {
    si += m.total_in||0; so += m.total_out||0;
    sl += m.leads||0;    sb += m.bounced||0;
  });
  const set = (id,v,cls) => {
    const el=document.getElementById(id);
    if(!el) return;
    if(el.textContent != v) { el.textContent=v; el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),450); }
  };
  set('g-in', si); set('g-out', so); set('g-leads', sl); set('g-bounced', sb);
}

// ─── RESET ───────────────────────────────────────────────────────────────
async function resetCam(camId) {
  try {
    const r = await fetch(`/api/reset/${camId}`, {method:'POST'});
    if (r.ok) logEvent(`Reset enviado: ${camId}`, 'warn');
    else logEvent(`Error reset ${camId}: ${r.status}`, 'error');
  } catch(e) { logEvent(`Fallo red: reset ${camId}`, 'error'); }
}

// ─── LOG ─────────────────────────────────────────────────────────────────
function logEvent(msg, level='info') {
  const el = document.getElementById('event-log');
  if (!el) return;
  const colors = {info:'text-blue-500', success:'text-green-400', warn:'text-yellow-400', error:'text-red-400'};
  const p = document.createElement('p');
  p.className = colors[level]||'text-gray-400';
  const t = new Date().toLocaleTimeString('es-MX',{hour12:false});
  p.textContent = `[${t}] ${msg}`;
  el.prepend(p);
  while (el.children.length > 60) el.removeChild(el.lastChild);
}

// ─── WEBSOCKET ───────────────────────────────────────────────────────────
let ws=null, wsRetries=0;

function connectWS() {
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/metrics`);

  ws.onopen = () => {
    wsRetries = 0;
    document.getElementById('ws-dot').className = 'w-2 h-2 rounded-full bg-green-500 pulse';
    document.getElementById('ws-lbl').textContent = 'En vivo';
    document.getElementById('ws-lbl').className = 'text-green-400';
    logEvent('WebSocket conectado', 'success');
  };

  ws.onmessage = ({data}) => {
    try {
      const msg = JSON.parse(data);
      if (msg.type==='metrics_update' || msg.type==='initial_state') {
        // Reloj
        const ck = document.getElementById('clock');
        if (ck) ck.textContent = new Date(msg.server_time*1000).toLocaleTimeString('es-MX',{hour12:false});

        // Procesar cada camara
        Object.entries(msg.cameras||{}).forEach(([camId, camData]) => {
          state.cameras[camId] = camData;
          ensureCamChip(camId);
          updateChipData(camId, camData);
          if (state.selected.has(camId)) {
            if (!feedCards[camId]) createFeedCard(camId);
            updateFeedCard(camId, camData);
          }
        });
        updateGlobalKPIs();
      }
      if (msg.type==='reset_ok') logEvent(`Reset OK: ${msg.cam_id}`, 'warn');
    } catch(e) { console.error('WS parse error', e); }
  };

  ws.onerror = () => logEvent('Error WS', 'error');
  ws.onclose = () => {
    document.getElementById('ws-dot').className = 'w-2 h-2 rounded-full bg-red-500';
    document.getElementById('ws-lbl').textContent = 'Desconectado';
    document.getElementById('ws-lbl').className = 'text-red-400';
    wsRetries++;
    if (wsRetries <= 30) {
      const delay = Math.min(1500*wsRetries, 12000);
      logEvent(`Reconectando WS en ${(delay/1000).toFixed(1)}s...`, 'warn');
      setTimeout(connectWS, delay);
    }
  };
}

// ─── INIT ────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  logEvent('Dashboard iniciado');
  connectWS();
});

// ─── EDITOR DE LÍNEAS ───────────────────────────────────────────────────────
const lineEditors = {}; // camId -> state

async function editLine(camId) {
  try {
    const res = await fetch(`/api/line/${camId}`);
    if(!res.ok) throw new Error("No se pudo obtener la línea");
    const data = await res.json();
    
    // UI
    document.getElementById(`fline-svg-${camId}`).classList.remove('hidden');
    document.getElementById(`fline-svg-${camId}`).classList.add('pointer-events-auto'); // habilitar clicks
    document.getElementById(`fline-editor-${camId}`).classList.remove('hidden');
    document.getElementById(`fline-editor-${camId}`).classList.add('flex');
    
    // Iniciar editor
    initLineEditor(camId, data.line.start, data.line.end);
    
  } catch (err) {
    alert("Error al cargar la línea para edición.");
    console.error(err);
  }
}

function initLineEditor(camId, startCoords, endCoords) {
  const svg = document.getElementById(`fline-svg-${camId}`);
  svg.innerHTML = ''; // limpiar
  
  // Guardamos las coords nativas (1280x720) en el estado
  lineEditors[camId] = {
    start: [...startCoords],
    end: [...endCoords],
    dragging: null // 'start' o 'end'
  };
  
  // Crear elementos SVG
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("stroke", "#ffeb3b");
  line.setAttribute("stroke-width", "4");
  line.setAttribute("stroke-dasharray", "8 4");
  
  const startHandle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  startHandle.setAttribute("r", "12");
  startHandle.setAttribute("fill", "#22c55e"); // Entrada - Verde
  startHandle.setAttribute("class", "cursor-move drop-shadow-md");
  
  const endHandle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  endHandle.setAttribute("r", "12");
  endHandle.setAttribute("fill", "#ef4444"); // Salida - Rojo
  endHandle.setAttribute("class", "cursor-move drop-shadow-md");

  svg.appendChild(line);
  svg.appendChild(startHandle);
  svg.appendChild(endHandle);
  
  const state = lineEditors[camId];
  const NATIVE_W = 1280;
  const NATIVE_H = 720;
  
  // Función para proyectar de coords nativas a pixeles SVG
  const updateDraw = () => {
    const rect = svg.getBoundingClientRect();
    const scaleX = rect.width / NATIVE_W;
    const scaleY = rect.height / NATIVE_H;
    
    const sx = state.start[0] * scaleX;
    const sy = state.start[1] * scaleY;
    const ex = state.end[0] * scaleX;
    const ey = state.end[1] * scaleY;
    
    line.setAttribute("x1", sx); line.setAttribute("y1", sy);
    line.setAttribute("x2", ex); line.setAttribute("y2", ey);
    startHandle.setAttribute("cx", sx); startHandle.setAttribute("cy", sy);
    endHandle.setAttribute("cx", ex); endHandle.setAttribute("cy", ey);
  };
  
  // Eventos de drag
  const getMousePos = (e) => {
    const rect = svg.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
    return [
      Math.round(x * (NATIVE_W / rect.width)),
      Math.round(y * (NATIVE_H / rect.height))
    ];
  };

  startHandle.onmousedown = (e) => { state.dragging = 'start'; e.stopPropagation(); };
  endHandle.onmousedown = (e) => { state.dragging = 'end'; e.stopPropagation(); };
  
  svg.onmousemove = (e) => {
    if(!state.dragging) return;
    state[state.dragging] = getMousePos(e);
    updateDraw();
  };
  
  window.addEventListener('mouseup', () => { state.dragging = null; });
  
  // Render inicial
  updateDraw();
  
  // Actualizar si resizea la ventana
  window.addEventListener('resize', updateDraw);
  state.updateDraw = updateDraw; // para swap
}

function swapLineOrientation(camId) {
  const state = lineEditors[camId];
  if(!state) return;
  const tmp = state.start;
  state.start = state.end;
  state.end = tmp;
  state.updateDraw();
}

function cancelEditLine(camId) {
  document.getElementById(`fline-svg-${camId}`).classList.add('hidden');
  document.getElementById(`fline-svg-${camId}`).classList.remove('pointer-events-auto');
  document.getElementById(`fline-editor-${camId}`).classList.add('hidden');
  document.getElementById(`fline-editor-${camId}`).classList.remove('flex');
  delete lineEditors[camId];
}

async function saveLine(camId) {
  const state = lineEditors[camId];
  if(!state) return;
  
  try {
    const res = await fetch(`/api/line/${camId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: state.start, end: state.end })
    });
    if(!res.ok) throw new Error("Error al guardar");
    cancelEditLine(camId);
  } catch (err) {
    alert("Error al guardar la línea.");
    console.error(err);
  }
}


// ─── GESTOR DE CÁMARAS ────────────────────────────────────────────────────────
function openDeviceManager() {
  document.getElementById('device-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('device-modal').classList.remove('opacity-0'), 10);
  fetchDevices();
}

function closeDeviceManager() {
  document.getElementById('device-modal').classList.add('opacity-0');
  setTimeout(() => document.getElementById('device-modal').classList.add('hidden'), 300);
}

async function fetchDevices() {
  const usbList = document.getElementById('usb-list');
  usbList.innerHTML = '<p class="text-xs text-gray-500 italic">Buscando dispositivos USB...</p>';
  
  try {
    const res = await fetch('/api/devices');
    const data = await res.json();
    
    usbList.innerHTML = '';
    
    if (data.usb_cameras.length === 0) {
      usbList.innerHTML = '<p class="text-xs text-gray-500 italic">No se encontraron cámaras USB.</p>';
    } else {
      data.usb_cameras.forEach(cam => {
        const isAdded = data.active_streams.some(id => data.sources[id] === cam.source);
        usbList.innerHTML += `
          <div class="flex items-center justify-between bg-surface-900 border border-gray-700 p-3 rounded-lg">
            <div>
              <p class="text-sm text-white font-medium">${cam.name} (Puerto ${cam.source})</p>
              <p class="text-xs text-gray-400">${cam.resolution} @ ${Math.round(cam.fps)} FPS</p>
            </div>
            <button onclick="addUsbCamera(${cam.source})" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${isAdded ? 'bg-gray-700 text-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white'}" ${isAdded ? 'disabled' : ''}>
              ${isAdded ? 'Añadida' : 'Añadir'}
            </button>
          </div>
        `;
      });
    }
  } catch (err) {
    usbList.innerHTML = '<p class="text-xs text-red-400">Error al cargar dispositivos.</p>';
  }
}

async function addUsbCamera(sourceId) {
  await submitCameraAdd(sourceId, `cam_usb_${sourceId}`);
}

async function addRtspCamera() {
  const url = document.getElementById('rtsp-url').value.trim();
  const errorEl = document.getElementById('rtsp-error');
  if (!url) return;
  
  errorEl.classList.add('hidden');
  const btn = event.currentTarget;
  const originalText = btn.innerText;
  btn.innerText = "Verificando...";
  btn.disabled = true;
  
  const camId = `cam_rtsp_${Date.now().toString().slice(-4)}`;
  
  try {
    await submitCameraAdd(url, camId);
    document.getElementById('rtsp-url').value = '';
  } catch (err) {
    errorEl.innerText = err.message || "Error al conectar al stream.";
    errorEl.classList.remove('hidden');
  } finally {
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

async function submitCameraAdd(source, camId) {
  const res = await fetch('/api/camera/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: source, cam_id: camId })
  });
  
  const data = await res.json();
  if (!res.ok) {
    throw new Error(data.detail);
  }
  
  // Refrescar modal y reconectar para generar los nuevos feeds visuales
  fetchDevices();
  setTimeout(() => window.location.reload(), 1000); // Reload rápido para re-renderizar todo
}

init();
